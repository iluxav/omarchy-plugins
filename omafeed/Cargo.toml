[package]
name = "omafeed"
version = "0.1.0"
edition = "2024"
description = "A live, read-only feed of mail, YouTube and RSS for the terminal"
license = "MIT"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
libc = "0.2"
ureq = { version = "2", features = ["gzip", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
feed-rs = "2.4"
mail-parser = "0.11"
htmd = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_norway = "0.9.42"

[profile.release]
opt-level = 3
lto = true
strip = true
